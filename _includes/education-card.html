{% include base_path %}

<div class="list__item">
  <article class="archive__item" data-collection="Education">
    <div class="archive__item-accent"></div>
    <div class="archive__item-body">
      <div class="archive__item-row">
        <div class="archive__item-left">
          <h2 class="archive__item-title">{{ include.school | markdownify | remove: "<p>" | remove: "</p>" }}</h2>
          <p class="archive__item-description education-card__major">{{ include.major }}</p>
          <p class="archive__item-description education-card__time">{{ include.time }}</p>
        </div>
        {% if include.logo %}
          <div class="archive__item-right">
            {% if include.logo == "/images/PKU.png" %}
              <picture>
                <source
                  type="image/webp"
                  srcset="{{ base_path }}/images/PKU-72.webp 72w, {{ base_path }}/images/PKU-144.webp 144w"
                  sizes="(min-width: 768px) 72px, 52px">
                <img class="archive__item-logo" src="{{ base_path }}{{ include.logo }}" alt="{{ include.school }} logo" width="72" height="72" loading="lazy" decoding="async">
              </picture>
            {% else %}
              <img class="archive__item-logo" src="{{ base_path }}{{ include.logo }}" alt="{{ include.school }} logo" width="360" height="360" loading="lazy" decoding="async">
            {% endif %}
          </div>
        {% endif %}
      </div>
    </div>
  </article>
</div>
